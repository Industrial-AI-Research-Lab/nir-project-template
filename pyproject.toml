[project]
name = "nir-project"
version = "0.1.0"
description = "Template for a semester research project (NIR)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.16",
    "numpy>=2.0",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.4",
    "pytest>=8.3",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nir_project"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
